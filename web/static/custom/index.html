<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>esh — custom worker demo</title><link rel="stylesheet" href="/assets/esh/esh-term.iife.css"><style type="text/css">html,body{height:100%;margin:0;background:#11111b;font-family:monospace}#hint{position:fixed;bottom:8px;right:16px;z-index:10;color:#585b70;font-size:.75rem;pointer-events:none}#term{height:100%;padding:8px;box-sizing:border-box}dialog#ask-dlg{background:#1e1e2e;color:#cdd6f4;border:1px solid #45475a;border-radius:8px;font-family:monospace;min-width:20rem}dialog#ask-dlg::backdrop{background:rgba(0,0,0,0.55)}dialog#ask-dlg input{width:100%;margin:.6rem 0;background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:6px;padding:.3rem .5rem;font-family:monospace;box-sizing:border-box}dialog#ask-dlg form.btns{text-align:right}dialog#ask-dlg form.btns button{background:#45475a;color:#cdd6f4;border:0;border-radius:6px;padding:.3rem .9rem;font-family:monospace;cursor:pointer;margin-left:.5rem}</style></head><body><div id="term"></div><div id="hint">custom worker — try: ask how many?, git init, help</div><dialog id="ask-dlg"><div id="ask-msg"></div><input type="number" id="ask-input" placeholder="42"><form class="btns" method="dialog"><button value="cancel" id="ask-cancel">cancel</button><button value="ok" id="ask-ok">ok</button></form></dialog><script src="/assets/esh/esh-term.iife.js"></script><script>var w,dlg,input,pending,resolveAsk,answer;w=new Worker("/js/custom-worker.js");dlg=document.getElementById("ask-dlg");input=document.getElementById("ask-input");pending=null;resolveAsk=function(e){if(pending==null){return}w.postMessage((e.type="hostcall-result",e.id=pending,e));return pending=null};answer=function(){var e;e=parseFloat(input.value);if(isNaN(e)){return resolveAsk({cancelled:true})}else{return resolveAsk({value:e})}};document.getElementById("ask-ok").addEventListener("click",function(){return answer()});document.getElementById("ask-cancel").addEventListener("click",function(){return resolveAsk({cancelled:true})});dlg.addEventListener("cancel",function(){return resolveAsk({cancelled:true})});dlg.addEventListener("close",function(){if(dlg.returnValue==="ok"){return answer()}else{return resolveAsk({cancelled:true})}});w.addEventListener("message",function(e){var n;n=e.data;if(!(n.type==="hostcall"&&n.call==="ask-number")){return}document.getElementById("ask-msg").textContent=n.msg||"give me a number";input.value="";pending=n.id;dlg.showModal();return input.focus()});eshTerm.createTerminal(document.getElementById("term"),{worker:w});</script></body></html>
