<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2.5 — shell syntax interpreter</title>
  <style>
    body { font-family: monospace; margin: 2rem; background: #1e1e2e; color: #cdd6f4; }
    h1 { font-size: 1.2rem; } h2 { font-size: 1rem; margin-top: 2rem; }
    .case { margin: .5rem 0; padding: .4rem .7rem; background: #313244; border-radius: 6px; }
    .cmd { color: #89b4fa; }
    .out { white-space: pre-wrap; margin: .2rem 0 0; color: #cdd6f4; }
    .err { color: #f38ba8; white-space: pre-wrap; }
    .pass { color: #a6e3a1; } .fail { color: #f38ba8; }
    #repl { background: #11111b; padding: 1rem; border-radius: 8px; }
    #log { white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
    #line { display: flex; gap: .5rem; margin-top: .5rem; }
    #prompt { color: #a6e3a1; }
    #input { flex: 1; background: transparent; border: none; outline: none; color: #cdd6f4; font: inherit; }
  </style>
</head>
<body>
  <h1>M2.5 — shell 語法直譯層 (bash-parser + ShellJS builtins)</h1>
  <div id="summary"></div>
  <div id="cases"></div>
  <h2>互動 REPL（直接輸入 shell 指令）</h2>
  <div id="repl">
    <div id="log"></div>
    <div id="line"><span id="prompt"></span><input id="input" autocomplete="off" spellcheck="false" /></div>
  </div>
  <script type="module" src="/src/m25.js"></script>
</body>
</html>
